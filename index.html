<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Presentation Viewer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080a0f;
    color: white;
    overflow: hidden;
}


/* ================================
   MAIN APP
================================ */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    background:
        radial-gradient(
            circle at center,
            #151923 0%,
            #080a0f 70%
        );
}


/* ================================
   HEADER
================================ */

.topbar {
    height: 64px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    background: rgba(15,18,25,.96);

    border-bottom: 1px solid #272c36;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 38px;
    height: 38px;

    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #7468ff,
        #5046d8
    );

    display: flex;
    justify-content: center;
    align-items: center;

    font-weight: bold;
    font-size: 19px;

    box-shadow:
        0 5px 20px rgba(99,91,255,.25);
}

.brandText h1 {
    font-size: 15px;
    font-weight: 600;
}

.brandText p {
    margin-top: 3px;

    color: #777f8e;

    font-size: 11px;
}

.topButtons {
    display: flex;
    gap: 8px;
}

.iconButton {
    width: 40px;
    height: 40px;

    border: 0;
    border-radius: 9px;

    background: #1a1e27;

    color: #d9dce3;

    font-size: 19px;

    cursor: pointer;

    transition: .2s;
}

.iconButton:hover {
    background: #635bff;
    color: white;
}


/* ================================
   VIEWER
================================ */

.viewer {
    flex: 1;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 0;

    padding: 18px 70px;
}


/* SLIDE AREA */

.slideArea {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}


/* CANVAS */

#pdfCanvas {
    display: block;

    max-width: 100%;
    max-height: 100%;

    background: white;

    border-radius: 4px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.65);

    user-select: none;
}


/* LOADING */

.loading {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    color: #8c94a3;

    font-size: 14px;

    text-align: center;
}

.loader {
    width: 30px;
    height: 30px;

    border: 3px solid #303642;

    border-top-color: #756bff;

    border-radius: 50%;

    animation: spin .8s linear infinite;

    margin: 0 auto 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* ================================
   NAVIGATION
================================ */

.navButton {
    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 48px;
    height: 70px;

    border: none;
    border-radius: 12px;

    background: rgba(26,30,39,.92);

    color: white;

    font-size: 40px;
    line-height: 1;

    cursor: pointer;

    z-index: 10;

    transition:
        background .2s,
        transform .2s,
        opacity .2s;
}

.navButton:hover {
    background: #635bff;

    transform:
        translateY(-50%)
        scale(1.04);
}

.navButton:disabled {
    opacity: .25;
    cursor: default;
}

#previous {
    left: 15px;
}

#next {
    right: 15px;
}


/* ================================
   CONTROLS
================================ */

.controls {
    height: 52px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    background: #10131a;

    border-top: 1px solid #252a33;
}

.controlButton {
    width: 36px;
    height: 32px;

    border: 0;

    border-radius: 7px;

    background: #1c212b;

    color: #cbd0d9;

    cursor: pointer;

    font-size: 14px;

    transition: .2s;
}

.controlButton:hover {
    background: #635bff;
    color: white;
}

.controlButton:disabled {
    opacity: .3;
    cursor: default;
}

.counter {
    min-width: 75px;

    text-align: center;

    color: #a9afba;

    font-size: 13px;
}

#currentSlide {
    color: white;
    font-weight: 600;
}


/* ================================
   PROGRESS
================================ */

.progress {
    width: 100%;
    height: 3px;

    background: #242934;

    flex-shrink: 0;
}

.progressBar {
    width: 0%;
    height: 100%;

    background: #635bff;

    transition: width .25s ease;
}


/* ================================
   THUMBNAILS
================================ */

.thumbnailPanel {
    height: 84px;

    flex-shrink: 0;

    background: #0d1016;

    border-top: 1px solid #242932;

    padding: 8px 15px;

    overflow-x: auto;
}

.thumbnailPanel::-webkit-scrollbar {
    height: 5px;
}

.thumbnailPanel::-webkit-scrollbar-track {
    background: #10131a;
}

.thumbnailPanel::-webkit-scrollbar-thumb {
    background: #353b47;

    border-radius: 10px;
}

.thumbnails {
    height: 100%;

    display: flex;

    justify-content: center;

    gap: 9px;
}

.thumbnail {
    width: 105px;
    height: 65px;

    flex-shrink: 0;

    object-fit: contain;

    background: white;

    border: 2px solid transparent;

    border-radius: 4px;

    cursor: pointer;

    opacity: .48;

    transition: .2s;
}

.thumbnail:hover {
    opacity: .85;
}

.thumbnail.active {
    border-color: #635bff;

    opacity: 1;

    box-shadow:
        0 0 12px rgba(99,91,255,.35);
}


/* ================================
   ERROR
================================ */

.error {
    display: none;

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 90%;
    max-width: 450px;

    padding: 25px;

    text-align: center;

    background: #171b23;

    border: 1px solid #2b303a;

    border-radius: 12px;
}

.error h2 {
    margin-bottom: 8px;

    font-size: 18px;
}

.error p {
    color: #9299a6;

    font-size: 13px;

    line-height: 1.6;
}


/* ================================
   MOBILE
================================ */

@media(max-width: 700px) {

    .topbar {
        height: 56px;

        padding: 0 12px;
    }

    .logo {
        width: 34px;
        height: 34px;
    }

    .brandText h1 {
        font-size: 13px;
    }

    .brandText p {
        display: none;
    }

    .viewer {
        padding: 5px 42px;
    }

    .navButton {
        width: 34px;
        height: 52px;

        font-size: 30px;

        border-radius: 8px;
    }

    #previous {
        left: 4px;
    }

    #next {
        right: 4px;
    }

    .controls {
        height: 48px;
    }

    .thumbnailPanel {
        display: none;
    }

    .controlButton {
        width: 34px;
        height: 30px;
    }
}


/* ================================
   FULLSCREEN
================================ */

:fullscreen .topbar {
    display: none;
}

:fullscreen .controls {
    display: none;
}

:fullscreen .progress {
    display: none;
}

:fullscreen .thumbnailPanel {
    display: none;
}

:fullscreen .viewer {
    padding: 20px 70px;
}


/* ================================
   TOUCH
================================ */

.slideArea {
    touch-action: pan-y;
}
</style>
</head>


<body>

<div class="app" id="app">

    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="logo">
                P
            </div>

            <div class="brandText">

                <h1 id="presentationTitle">
                    My Presentation
                </h1>

                <p>
                    Online Presentation Viewer
                </p>

            </div>

        </div>


        <div class="topButtons">

            <button
                class="iconButton"
                id="fullscreenButton"
                title="Fullscreen">

                ⛶

            </button>

        </div>

    </header>


    <!-- =====================================
         SLIDE VIEWER
    ====================================== -->

    <main class="viewer">

        <button
            class="navButton"
            id="previous"
            title="Previous Slide">

            ‹

        </button>


        <div
            class="slideArea"
            id="slideArea">

            <canvas id="pdfCanvas"></canvas>


            <div
                class="loading"
                id="loading">

                <div class="loader"></div>

                Loading presentation...

            </div>


            <div
                class="error"
                id="error">

                <h2>
                    Presentation unavailable
                </h2>

                <p>
                    Make sure that
                    <b>presentation.pdf</b>
                    is placed in the same folder
                    as this HTML file.
                </p>

            </div>

        </div>


        <button
            class="navButton"
            id="next"
            title="Next Slide">

            ›

        </button>

    </main>


    <!-- =====================================
         PROGRESS
    ====================================== -->

    <div class="progress">

        <div
            class="progressBar"
            id="progressBar">
        </div>

    </div>


    <!-- =====================================
         CONTROLS
    ====================================== -->

    <div class="controls">

        <button
            class="controlButton"
            id="firstButton"
            title="First Slide">

            ⏮

        </button>


        <button
            class="controlButton"
            id="previousSmall"
            title="Previous">

            ←

        </button>


        <div class="counter">

            <span id="currentSlide">
                1
            </span>

            <span>
                /
            </span>

            <span id="totalSlides">
                0
            </span>

        </div>


        <button
            class="controlButton"
            id="nextSmall"
            title="Next">

            →

        </button>


        <button
            class="controlButton"
            id="lastButton"
            title="Last Slide">

            ⏭

        </button>

    </div>


    <!-- =====================================
         THUMBNAILS
    ====================================== -->

    <div class="thumbnailPanel">

        <div
            class="thumbnails"
            id="thumbnails">
        </div>

    </div>

</div>


<!-- ==========================================
     PDF.JS
=========================================== -->

<script type="module">

import {
    getDocument,
    GlobalWorkerOptions
}
from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


/* ==========================================
   PDF.JS WORKER
========================================== */

GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* ==========================================
   SETTINGS
========================================== */

const PDF_FILE =
    "presentation.pdf";


/* ==========================================
   ELEMENTS
========================================== */

const canvas =
    document.getElementById("pdfCanvas");

const ctx =
    canvas.getContext("2d");

const slideArea =
    document.getElementById("slideArea");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const currentSlide =
    document.getElementById("currentSlide");

const totalSlides =
    document.getElementById("totalSlides");

const progressBar =
    document.getElementById("progressBar");

const thumbnails =
    document.getElementById("thumbnails");

const previousButton =
    document.getElementById("previous");

const nextButton =
    document.getElementById("next");


/* ==========================================
   VARIABLES
========================================== */

let pdf = null;

let pageNumber = 1;

let rendering = false;

let pendingPage = null;

let touchStartX = 0;


/* ==========================================
   LOAD PRESENTATION
========================================== */

async function loadPresentation() {

    try {

        const loadingTask =
            getDocument(PDF_FILE);

        pdf =
            await loadingTask.promise;


        totalSlides.textContent =
            pdf.numPages;


        loading.style.display =
            "none";


        createThumbnails();


        await renderPage(1);


    } catch (error) {

        console.error(error);

        loading.style.display =
            "none";

        errorBox.style.display =
            "block";

    }

}


/* ==========================================
   RENDER SLIDE
========================================== */

async function renderPage(number) {

    if (!pdf)
        return;


    if (rendering) {

        pendingPage = number;

        return;

    }


    rendering = true;


    try {

        const page =
            await pdf.getPage(number);


        const originalViewport =
            page.getViewport({
                scale: 1
            });


        const availableWidth =
            slideArea.clientWidth;


        const availableHeight =
            slideArea.clientHeight;


        const scaleX =
            availableWidth /
            originalViewport.width;


        const scaleY =
            availableHeight /
            originalViewport.height;


        const scale =
            Math.min(
                scaleX,
                scaleY
            );


        const viewport =
            page.getViewport({
                scale: scale
            });


        const devicePixelRatio =
            window.devicePixelRatio || 1;


        canvas.width =
            viewport.width *
            devicePixelRatio;


        canvas.height =
            viewport.height *
            devicePixelRatio;


        canvas.style.width =
            viewport.width + "px";


        canvas.style.height =
            viewport.height + "px";


        const renderContext = {

            canvasContext: ctx,

            viewport: viewport,

            transform:
                devicePixelRatio !== 1
                ? [
                    devicePixelRatio,
                    0,
                    0,
                    devicePixelRatio,
                    0,
                    0
                ]
                : null

        };


        await page.render(
            renderContext
        ).promise;


        pageNumber =
            number;


        currentSlide.textContent =
            pageNumber;


        const percentage =
            (
                pageNumber /
                pdf.numPages
            ) * 100;


        progressBar.style.width =
            percentage + "%";


        updateNavigation();


        updateActiveThumbnail();


    } catch (error) {

        console.error(
            "Rendering error:",
            error
        );

    }


    rendering = false;


    if (pendingPage !== null) {

        const nextPage =
            pendingPage;

        pendingPage = null;

        renderPage(nextPage);

    }

}


/* ==========================================
   NEXT SLIDE
========================================== */

function nextSlide() {

    if (!pdf)
        return;


    if (
        pageNumber <
        pdf.numPages
    ) {

        renderPage(
            pageNumber + 1
        );

    }

}


/* ==========================================
   PREVIOUS SLIDE
========================================== */

function previousSlide() {

    if (!pdf)
        return;


    if (pageNumber > 1) {

        renderPage(
            pageNumber - 1
        );

    }

}


/* ==========================================
   FIRST SLIDE
========================================== */

function firstSlide() {

    if (!pdf)
        return;

    renderPage(1);

}


/* ==========================================
   LAST SLIDE
========================================== */

function lastSlide() {

    if (!pdf)
        return;

    renderPage(
        pdf.numPages
    );

}


/* ==========================================
   NAVIGATION STATE
========================================== */

function updateNavigation() {

    previousButton.disabled =
        pageNumber === 1;


    nextButton.disabled =
        pageNumber === pdf.numPages;

}


/* ==========================================
   BUTTON EVENTS
========================================== */

previousButton.onclick =
    previousSlide;

nextButton.onclick =
    nextSlide;


document.getElementById(
    "previousSmall"
).onclick =
    previousSlide;


document.getElementById(
    "nextSmall"
).onclick =
    nextSlide;


document.getElementById(
    "firstButton"
).onclick =
    firstSlide;


document.getElementById(
    "lastButton"
).onclick =
    lastSlide;


/* ==========================================
   KEYBOARD CONTROL
========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "ArrowRight"
        ) {

            nextSlide();

        }


        else if (
            event.key ===
            "ArrowLeft"
        ) {

            previousSlide();

        }


        else if (
            event.key ===
            "Home"
        ) {

            firstSlide();

        }


        else if (
            event.key ===
            "End"
        ) {

            lastSlide();

        }


        else if (
            event.key ===
            " " ||
            event.key === "PageDown"
        ) {

            event.preventDefault();

            nextSlide();

        }


        else if (
            event.key ===
            "PageUp"
        ) {

            previousSlide();

        }


        else if (
            event.key === "f" ||
            event.key === "F"
        ) {

            toggleFullscreen();

        }

    }
);


/* ==========================================
   FULLSCREEN
========================================== */

function toggleFullscreen() {

    if (
        !document.fullscreenElement
    ) {

        document
            .getElementById("app")
            .requestFullscreen();

    }

    else {

        document.exitFullscreen();

    }

}


document.getElementById(
    "fullscreenButton"
).onclick =
    toggleFullscreen;


/* ==========================================
   THUMBNAILS
========================================== */

async function createThumbnails() {

    thumbnails.innerHTML = "";


    for (
        let i = 1;
        i <= pdf.numPages;
        i++
    ) {

        try {

            const page =
                await pdf.getPage(i);


            const viewport =
                page.getViewport({
                    scale: 0.18
                });


            const thumb =
                document.createElement(
                    "canvas"
                );


            thumb.width =
                viewport.width;


            thumb.height =
                viewport.height;


            thumb.className =
                "thumbnail";


            const thumbContext =
                thumb.getContext("2d");


            await page.render({

                canvasContext:
                    thumbContext,

                viewport:
                    viewport

            }).promise;


            thumb.addEventListener(
                "click",
                function() {

                    renderPage(i);

                }
            );


            thumbnails.appendChild(
                thumb
            );

        } catch (error) {

            console.error(
                "Thumbnail error:",
                error
            );

        }

    }


    updateActiveThumbnail();

}


/* ==========================================
   ACTIVE THUMBNAIL
========================================== */

function updateActiveThumbnail() {

    const items =
        thumbnails.children;


    for (
        let i = 0;
        i < items.length;
        i++
    ) {

        if (
            i + 1 ===
            pageNumber
        ) {

            items[i]
                .classList
                .add("active");


            items[i].scrollIntoView({
                behavior: "smooth",
                block: "nearest",
                inline: "center"
            });

        }

        else {

            items[i]
                .classList
                .remove("active");

        }

    }

}


/* ==========================================
   SWIPE SUPPORT
========================================== */

slideArea.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.touches[0].clientX;

    },
    {
        passive: true
    }
);


slideArea.addEventListener(
    "touchend",
    function(event) {

        const touchEndX =
            event.changedTouches[0].clientX;


        const difference =
            touchEndX -
            touchStartX;


        if (
            Math.abs(difference) <
            50
        )
            return;


        if (difference < 0) {

            nextSlide();

        }

        else {

            previousSlide();

        }

    },
    {
        passive: true
    }
);


/* ==========================================
   RESIZE
========================================== */

let resizeTimer;


window.addEventListener(
    "resize",
    function() {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                function() {

                    if (pdf) {

                        renderPage(
                            pageNumber
                        );

                    }

                },
                150
            );

    }
);


/* ==========================================
   START
========================================== */

loadPresentation();

</script>

</body>
</html>
